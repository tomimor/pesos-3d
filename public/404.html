<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No está acá — pesos-3d</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..600&display=swap">
<link rel="stylesheet" href="/lib/site.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .rosette { position: fixed; inset: 50% auto auto 50%; width: min(110vh, 110vw); height: min(110vh, 110vw); transform: translate(-50%, -50%); }
  main { position: relative; z-index: 2; }
  h1 { font-family: var(--display); font-weight: 500; font-variation-settings: 'opsz' 96; font-size: clamp(120px, 26vw, 280px); line-height: 0.85; margin: 0; letter-spacing: -0.04em;
    color: transparent; background: repeating-linear-gradient(180deg, var(--paper) 0 1.6px, transparent 1.6px 3.4px); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 1px rgba(239, 233, 218, 0.55); }
  p { font-family: var(--display); font-style: italic; font-size: 24px; color: var(--glow); margin: 12px 0 32px; }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="rosette" data-seed="404"></div>
<main>
  <h1>404</h1>
  <p>Esta pieza no está en la colección.</p>
  <a class="btn solid" href="/">Volver a la colección</a>
</main>
<div class="grain" aria-hidden="true"></div>
<script type="module">
  import { rosette } from '/lib/guilloche.js';
  document.querySelector('.rosette').innerHTML = rosette('404');
</script>
</body>
</html>
