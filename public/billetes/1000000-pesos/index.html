<style>
  html,body{margin:0;height:100%;background:#2a2826}
  three-d-stage:not(:defined){visibility:hidden}

  .hud{position:fixed;top:16px;left:16px;z-index:1;display:flex;gap:8px;align-items:baseline;font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f0ebe1}
  .hud a{color:inherit;opacity:.6;text-decoration:none}.hud a:hover{opacity:1}.hud span{opacity:.35}
  .hud h1{font:inherit;margin:0}
  three-d-stage{--stage-note:rgba(240,235,225,.7)}
</style>

<body>
<header class="hud"><a href="../../">pesos-3d</a><span>/</span><h1>1.000.000 de pesos</h1></header>
<three-d-stage view="top" name="argentina-1000000-pesos" background="#2a2826"></three-d-stage>
<script src="../../lib/stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

// Real-world size (m): 155 mm long, depth from scan aspect 3624:1750
const W = 0.155, D = W * 1750 / 3624, T = 0.00011;
const hw = W / 2, hd = D / 2;

const loader = new THREE.TextureLoader();
const [front, back, bumpF, bumpB, alphaF, alphaB] = await Promise.all([
  loader.loadAsync('texturas/frente.webp'),
  loader.loadAsync('texturas/dorso.webp'),
  // high-pass bump: creases + engraving only, so grime/edge shading doesn't read as relief
  loader.loadAsync('texturas/frente-relieve.webp'),
  loader.loadAsync('texturas/dorso-relieve.webp'),
  // worn rounded corners + slight fray (back copy rotated 180° to match its UVs)
  loader.loadAsync('texturas/frente-alfa.png'),
  loader.loadAsync('texturas/dorso-alfa.png'),
]);
for (const t of [front, back]) { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; }
for (const t of [bumpF, bumpB, alphaF, alphaB]) { t.colorSpace = THREE.NoColorSpace; t.anisotropy = 16; }

// Same paper both sides; back gets a light self-illumination to offset the key light coming from above
const matFront = new THREE.MeshStandardMaterial({ name: 'bill_front', map: front, bumpMap: bumpF, bumpScale: 0.35, roughness: 0.88, metalness: 0, alphaMap: alphaF, alphaTest: 0.5 });
const matBack  = new THREE.MeshStandardMaterial({ name: 'bill_back',  map: back,  bumpMap: bumpB, bumpScale: 0.35, roughness: 0.88, metalness: 0, alphaMap: alphaB, alphaTest: 0.5,
  emissive: 0xffffff, emissiveMap: back, emissiveIntensity: 0.64 }); // 0.64 ≈ top-side light (hemi 1.0 + key 1.62 + fill 0.21)/π minus underside hemi 0.83/π
// 0.11 mm side walls would float past the cut-out corners; the faces' own edge tone reads as the paper edge
const matEdge  = new THREE.MeshStandardMaterial({ name: 'paper_edge', color: 0x857868, roughness: 1, metalness: 0, visible: false });

// Box groups: 0 +x, 1 -x, 2 +y (front), 3 -y (back), 4 +z, 5 -z
const geo = new THREE.BoxGeometry(W, T, D, 220, 1, 90);
// Back UVs rotated 180° so the reverse reads upright when the note is turned side-to-side
{ const n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < n.count; i++) if (n.getY(i) < -0.5) uv.setXY(i, 1 - uv.getX(i), 1 - uv.getY(i)); }

// Crisp, lightly handled note: soft center fold, gentle wave, ends lifting, faint ripples
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function lift(x, z, t) {
  const u = x / hw, v = z / hd;
  const b = Math.sin(t * 0.9), c = Math.sin(t * 0.6 + 1.3);
  let y = 0;
  y += 0.0045 * Math.exp(-u * u * 2.6);
  y += (0.0035 + 0.001 * b) * Math.sin(u * Math.PI * 1.4 + 0.5) * (0.65 + 0.35 * Math.cos(v * 1.2));
  y += (0.0065 + 0.0015 * c) * Math.pow(sstep(0.4, 1, u), 2) * (0.75 + 0.4 * sstep(-0.2, 1, -v));
  y += (0.004 + 0.0012 * b) * Math.pow(sstep(0.5, 1, -u), 2) * (0.65 + 0.5 * sstep(-0.3, 1, v));
  y += 0.0016 * v * v * (1 - 0.4 * Math.abs(u));
  y += 0.00025 * Math.sin(u * 11 + v * 4 + t * 0.7) * Math.cos(v * 6 - u * 3);
  return y;
}
const p = geo.attributes.position;
const baseY = new Float32Array(p.count);
for (let i = 0; i < p.count; i++) baseY[i] = p.getY(i);
function deform(t) {
  let minY = Infinity;
  for (let i = 0; i < p.count; i++) {
    const y = baseY[i] + lift(p.getX(i), p.getZ(i), t);
    p.setY(i, y); if (y < minY) minY = y;
  }
  for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) - minY);
  p.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
}
deform(0);

const bill = new THREE.Mesh(geo, [matEdge, matEdge, matFront, matBack, matEdge, matEdge]);
bill.name = 'banknote_1000000_pesos';
bill.castShadow = true; bill.receiveShadow = true;

const model = new THREE.Group();
model.name = 'BCRA_1000000_Pesos';
model.add(bill);
stage.setObject(model);

const clock = new THREE.Clock();
(function tick() { deform(clock.getElapsedTime()); requestAnimationFrame(tick); })();
</script>
</body>
</html>
