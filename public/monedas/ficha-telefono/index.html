<body>
<three-d-stage name="telefono-token" autorotate></three-d-stage>
<script src="../../lib/stage.js"></script>
<script type="module">
import { buildCoin } from '../../lib/coin-lab.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
stage.setObject(await buildCoin(THREE, {
  name: 'telefono_token',
  obverse: '../fotos/telefono-anverso.jpg',
  reverse: '../fotos/telefono-reverso.jpg',
  D: 19, T: 2.2, rimW: 0, rimH: 0, relief: 0.1, bevel: 0.15,
  metal: { metalness: 0.35, roughness: 0.45 },
  grooves: [
    { wall: -0.686, floor: 0.136, ramp: 0.19, depth: 0.5 },
    { wall: 0.317, floor: 0.133, ramp: 0.17, depth: 0.5 },
  ],
  edge: { mode: 'faceRing', source: 'reverse' },
}));
</script>
<script type="module" src="../../lib/pieza.js"></script>
</body>
